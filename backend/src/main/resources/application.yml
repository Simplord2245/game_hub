spring:
  application:
    name: gamehub-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gamehub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8088}

logging:
  level:
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG:WARN}

# ── JWT ──────────────────────────────────────────────────────────────────────
# Thay JWT_SECRET bằng chuỗi ngẫu nhiên ≥ 32 ký tự trước khi deploy lên production.
# Ví dụ tạo secret: openssl rand -base64 48
app:
  jwt:
    secret: ${JWT_SECRET:gamehub-default-secret-change-in-production-!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 giờ
